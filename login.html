<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your free PrepareKora account and start practising for Assam competitive exams.">
  <title>Sign Up — PrepareKora</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <span class="brand-logo">P</span>
      <span>PrepareKora</span>
    </a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="find-us.html">Find Us</a>
    </nav>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-outline btn-sm">Login</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile" id="navMobile">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="find-us.html">Find Us</a>
    <a href="login.html">Login</a>
  </div>
</header>

<section class="section" style="background: var(--bg-subtle); min-height: calc(100vh - 200px); display: flex; align-items: center;">
  <div class="container" style="max-width: 440px;">
    <div class="card" style="padding: var(--space-8);">
      <h1 style="font-size: var(--font-size-2xl); margin-bottom: var(--space-2);">Create Your Account</h1>
      <p style="color: var(--text-muted); font-size: var(--font-size-sm); margin-bottom: var(--space-6);">Start your free preparation journey today.</p>

      <div id="signupError" class="alert alert-error hidden" role="alert"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" name="fullName" class="form-input" autocomplete="name" required aria-required="true">
          <div class="form-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" autocomplete="email" required aria-required="true">
          <div class="form-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" autocomplete="new-password" required aria-required="true">
          <div class="form-hint">Minimum 8 characters</div>
          <div class="form-error" role="alert"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" autocomplete="new-password" required aria-required="true">
          <div class="form-error" role="alert"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupBtn">Create Account</button>
      </form>

      <p class="text-center mt-6" style="font-size: var(--font-size-sm); color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: var(--font-weight-semibold);">Login</a>
      </p>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">&copy; <span id="currentYear"></span> PrepareKora. All rights reserved.</div>
  </div>
</footer>

<div class="toast-container" id="toastContainer"></div>

<script src="js/script.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
